<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="RomM-Themes - the RomM Switch client library screen rendered in the Midnight Borb theme, with the focus ring moving between game cards">
  <title>RomM-Themes</title>
  <desc>A mock of the RomM Switch client's library screen, themed with Midnight Borb. The focus ring travels between cards the way it does on a console.</desc>

  <!--
    Every colour below is a role from themes/Midnight Borb/theme.json, named in
    the comments so this file stays checkable against the theme it depicts.
    Hand-written and committed rather than generated by a badge service, so the
    README cannot break when someone else's server changes.
  -->

  <defs>
    <!-- Background drift: what background.motion "drift" does, at no memory cost. -->
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#4C8DFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#8A6BFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8A6BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#9CC2FF"/>
      <stop offset="100%" stop-color="#8A6BFF"/>
    </linearGradient>

    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4C8DFF"/>
      <stop offset="100%" stop-color="#79A9FF"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="420" rx="14"/>
    </clipPath>
    <clipPath id="barClip">
      <rect x="64" y="352" width="360" height="10" rx="5"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- bg -->
    <rect width="1280" height="420" fill="#07080F"/>

    <!-- Drifting light, mirroring background.motion. -->
    <ellipse cx="240" cy="90" rx="420" ry="300" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 90 40; 0 0" dur="14s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </ellipse>
    <ellipse cx="1080" cy="380" rx="460" ry="320" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -80 -46; 0 0" dur="18s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </ellipse>

    <!-- Title row -->
    <text x="64" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="42" font-weight="700" fill="url(#titleFade)">RomM-Themes</text>
    <text x="64" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="17" fill="#8C97B8">themes for the RomM Switch client</text>

    <!-- accent chip -->
    <g>
      <rect x="1016" y="48" width="200" height="38" rx="19" fill="#4C8DFF"/>
      <text x="1116" y="73" text-anchor="middle"
            font-family="Segoe UI, Helvetica, Arial, sans-serif"
            font-size="17" font-weight="600" fill="#07080F">Midnight Borb</text>
    </g>

    <!-- ============ cards ============
         surface_raised fill, border stroke. The selected card's highlight and
         the focus ring travel together, which is the single most important
         thing a theme has to get right: on a controller the ring IS the
         cursor. -->
    <g>
      <rect x="64"  y="146" width="273" height="150" rx="12" fill="#141A2C" stroke="#2C3654"/>
      <rect x="357" y="146" width="273" height="150" rx="12" fill="#141A2C" stroke="#2C3654"/>
      <rect x="650" y="146" width="273" height="150" rx="12" fill="#141A2C" stroke="#2C3654"/>
      <rect x="943" y="146" width="273" height="150" rx="12" fill="#141A2C" stroke="#2C3654"/>

      <!-- Selected-card highlight (surface_hover). Painted here, BEFORE the
           card contents, so it sits behind the cover art and the title the way
           a background fill should - drawn after them it hid the very card it
           was meant to be highlighting. The ring is stroke-only and stays on
           top, below. -->
      <rect y="146" width="273" height="150" rx="12" fill="#1E263F">
        <animate attributeName="x"
          values="64;357;650;943;650;357;64"
          keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"
          dur="9s" repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.5 0 0.2 1;0.5 0 0.2 1;0.5 0 0.2 1;0.5 0 0.2 1;0.5 0 0.2 1;0.5 0 0.2 1"/>
      </rect>

      <!-- cover placeholders (surface) -->
      <rect x="80"  y="160" width="241" height="86" rx="8" fill="#0D101C"/>
      <rect x="373" y="160" width="241" height="86" rx="8" fill="#0D101C"/>
      <rect x="666" y="160" width="241" height="86" rx="8" fill="#0D101C"/>
      <rect x="959" y="160" width="241" height="86" rx="8" fill="#0D101C"/>

      <!-- titles (text_strong) and meta -->
      <text x="80"  y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Borb Quest</text>
      <text x="373" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Sky Runner DX</text>
      <text x="666" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Cavern of Echoes</text>
      <text x="959" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Neon Drift</text>

      <text x="80"  y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8C97B8">2.4 GB</text>
      <text x="373" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8C97B8">812 MB</text>
      <text x="666" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8C97B8">1.1 GB</text>
      <!-- success: an installed title -->
      <text x="959" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#4FC08D">Installed</text>
    </g>

    <!-- focus_ring, travelling on the same timing as the highlight above -->
    <rect y="146" width="273" height="150" rx="12" fill="none" stroke="#9CC2FF" stroke-width="3">
      <animate attributeName="x"
        values="64;357;650;943;650;357;64"
        keyTimes="0;0.166;0.333;0.5;0.666;0.833;1"
        dur="9s" repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.5 0 0.2 1;0.5 0 0.2 1;0.5 0 0.2 1;0.5 0 0.2 1;0.5 0 0.2 1;0.5 0 0.2 1"/>
      <animate attributeName="stroke-opacity"
        values="1;0.55;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>

    <!-- ============ install progress ============ -->
    <text x="64" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="14" fill="#8C97B8">Installing&#8230;</text>
    <rect x="64" y="352" width="360" height="10" rx="5" fill="#0D101C"/>
    <g clip-path="url(#barClip)">
      <rect x="64" y="352" width="360" height="10" rx="5" fill="url(#barFill)">
        <animate attributeName="width" values="0;360" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- status roles, so every colour family shows up somewhere -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      <circle cx="470" cy="357" r="5" fill="#4FC08D"/>
      <text x="482" y="362" fill="#4FC08D">success</text>
      <circle cx="576" cy="357" r="5" fill="#E8B04B"/>
      <text x="588" y="362" fill="#E8B04B">warning</text>
      <circle cx="684" cy="357" r="5" fill="#E4605A"/>
      <text x="696" y="362" fill="#E4605A">danger</text>
      <circle cx="780" cy="357" r="5" fill="#5AA9E6"/>
      <text x="792" y="362" fill="#5AA9E6">info</text>
    </g>

    <!-- hint bar (border + text_muted), like the client's own -->
    <line x1="64" y1="322" x2="1216" y2="322" stroke="#2C3654"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8C97B8">
      <rect x="1060" y="346" width="60" height="22" rx="6" fill="#141A2C"/>
      <text x="1090" y="361" text-anchor="middle" fill="#E4E9F7">ZL+ZR</text>
      <text x="1128" y="361">swap</text>
    </g>
  </g>
</svg>
