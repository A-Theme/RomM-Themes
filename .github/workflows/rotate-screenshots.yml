name: rotate screenshots

on:
  schedule:
    - cron: "0 7 * * *"   # once a day, 07:00 UTC (~3am Eastern)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "screenshots/**"   # also refresh immediately when new ones are added

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pick random screenshots and update README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const folder = 'screenshots';
            const exts = ['.jpg', '.jpeg', '.png', '.gif', '.webp'];
            if (!fs.existsSync(folder)) {
              console.log('No screenshots folder yet -- nothing to rotate.');
              return;
            }
            const files = fs.readdirSync(folder)
              .filter(f => exts.includes(path.extname(f).toLowerCase()));

            if (files.length === 0) {
              console.log('No images in "' + folder + '" -- nothing to rotate.');
              return;
            }

            function shuffle(arr) {
              const a = [...arr];
              for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
              }
              return a;
            }

            const N = Math.min(3, files.length);
            const chosen = shuffle(files).slice(0, N);

            const branch = 'main';
            const repo = 'A-Theme/RomM-Themes';
            // A screenshot is named after its theme folder, so the file name
            // doubles as the caption.
            const imgTags = chosen.map(f => {
              const label = path.basename(f, path.extname(f));
              const url = `https://raw.githubusercontent.com/${repo}/${branch}/` +
                          `${encodeURIComponent(folder)}/${encodeURIComponent(f)}`;
              return `<img src="${url}" width="320" alt="${label}" title="${label}"/>`;
            }).join('\n');
            const block = `<div align="center">\n${imgTags}\n</div>`;

            let readme = fs.readFileSync('README.md', 'utf8');
            if (!readme.includes('<!-- SCREENSHOTS:START -->') ||
                !readme.includes('<!-- SCREENSHOTS:END -->')) {
              console.log('README.md is missing the SCREENSHOTS markers -- nothing to update.');
              return;
            }

            const updated = readme.replace(
              /<!-- SCREENSHOTS:START -->[\s\S]*?<!-- SCREENSHOTS:END -->/,
              `<!-- SCREENSHOTS:START -->\n${block}\n<!-- SCREENSHOTS:END -->`
            );

            fs.writeFileSync('README.md', updated);
            console.log(`Rotated in: ${chosen.join(', ')}`);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Rotate README screenshots [skip ci]"
          git push
