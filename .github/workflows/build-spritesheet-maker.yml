name: build sprite sheet maker

# Packages tools/spritesheet-maker into a single executable, so contributors who
# want to build an animated background do not have to install Python first.
#
# Windows is the one that matters -- it is what people asking for "an exe" are
# on -- but the same spec builds a native binary on macOS and Linux, and those
# cost a few minutes each, so all three run.
#
# PyInstaller cannot cross-compile: each binary has to be built on its own OS,
# which is exactly what a matrix of runners is for.

on:
  push:
    tags:
      - "spritesheet-maker-v*"
    branches: [ main ]
    paths:
      - "tools/spritesheet-maker/**"
      - ".github/workflows/build-spritesheet-maker.yml"
  pull_request:
    paths:
      - "tools/spritesheet-maker/**"
      - ".github/workflows/build-spritesheet-maker.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Cut a release at this version (e.g. 1.0.0). Leave empty to only build."
        required: false
        default: ""
  release:
    types: [ published ]

defaults:
  run:
    working-directory: tools/spritesheet-maker

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            binary: dist/spritesheet-maker.exe
            artifact: spritesheet-maker-windows
          - os: ubuntu-latest
            label: linux
            binary: dist/spritesheet-maker
            artifact: spritesheet-maker-linux
          - os: macos-latest
            label: macos
            binary: dist/spritesheet-maker
            artifact: spritesheet-maker-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # The checks that do not need a server or a browser. A binary that packs
      # sheets wrongly is worse than no binary, so they run before it is built.
      - name: Run the offline checks
        run: |
          python tests/check_extract.py
          python tests/check_pack.py
          python tests/check_slice.py
          python tests/check_generate.py
          python tests/check_atlas.py
          python tests/check_romm.py
          python tests/check_catalog.py

      - name: Build
        run: pyinstaller --clean --noconfirm spritesheet-maker.spec

      # Starting it is the only check that catches a missing hidden import:
      # PyInstaller resolves uvicorn's protocol modules by name, so a bad spec
      # builds fine and then dies on the first request.
      - name: Start it and ask it for /health
        shell: bash
        run: |
          ./${{ matrix.binary }} --no-browser --port 8791 &
          pid=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8791/health > health.json 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat health.json
          python -c "import json; d = json.load(open('health.json')); assert d['status'] == 'ok', d"
          curl -fsS -o /dev/null http://127.0.0.1:8791/
          curl -fsS -o /dev/null http://127.0.0.1:8791/static/app.js
          kill $pid || true
          echo "the packaged build serves the page and its assets"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tools/spritesheet-maker/${{ matrix.binary }}
          if-no-files-found: error

  # Cutting a release is pushing a tag: the binaries the matrix just built and
  # smoke-tested are attached to it, so a download is a link rather than an
  # Actions run to dig through. Notes come from the tool's own CHANGELOG.md,
  # the same way Theme-App does it.
  # Two ways in: push a spritesheet-maker-v* tag, or run this workflow from the
  # Actions tab with a version, which tags the commit it ran on. The second
  # exists because pushing a tag is not always available to whoever is cutting
  # the release.
  release:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the binaries after their platform
        run: |
          mkdir -p release
          cp ../../artifacts/spritesheet-maker-windows/spritesheet-maker.exe release/spritesheet-maker-windows.exe
          cp ../../artifacts/spritesheet-maker-macos/spritesheet-maker       release/spritesheet-maker-macos
          cp ../../artifacts/spritesheet-maker-linux/spritesheet-maker       release/spritesheet-maker-linux
          chmod +x release/spritesheet-maker-macos release/spritesheet-maker-linux
          ls -la release

      # awk rather than a heredoc'd script: a YAML block indents every line it
      # carries, which Python would reject on its first statement.
      - name: Take the notes from CHANGELOG.md
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME#spritesheet-maker-v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG_NAME=spritesheet-maker-v$version" >> "$GITHUB_ENV"
          awk -v want="$version" '
            /^## /  { if (found) exit; if ($2 == want) { found = 1; next } }
            found   { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Sprite Sheet Maker ${{ env.VERSION }}
          body_path: tools/spritesheet-maker/release-notes.md
          files: tools/spritesheet-maker/release/*
          fail_on_unmatched_files: true
